# After changing `info`, run `wails3 task common:update:build-assets` to regenerate the
# platform files. It overwrites hand fixes in build/linux/desktop, build/linux/nfpm/nfpm.yaml
# and build/windows/info.json, so restore those afterwards.
version: '3'

info:
  companyName: "Garrett Speager"
  productName: "Current Client"
  productIdentifier: "io.github.gspeager.current-client"
  description: "A privacy-first Git client"
  copyright: "Copyright 2026 Garrett Speager"
  comments: "Licensed under the Apache License 2.0"
  version: "0.1.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
