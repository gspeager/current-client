name: Feature request
description: Suggest something Current Client should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The task or problem, rather than a specific solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This only connects to destinations the user configures, such as a repository's remotes or their host, never a third party (see CONTRIBUTING.md). If it needs any network access beyond a Git operation the user starts, I've explained what and how it stays off by default.
          required: true
